<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch Party</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="auth" class="auth-screen">
    <div class="auth-box">
      <h1>Watch Party</h1>
      <p class="hint">Войдите или создайте аккаунт</p>
      <input id="authName" placeholder="Имя пользователя" autocomplete="username">
      <input id="authPass" type="password" placeholder="Пароль" autocomplete="current-password">
      <div class="auth-actions">
        <button id="loginBtn">Войти</button>
        <button id="registerBtn" class="ghost">Регистрация</button>
      </div>
      <p id="authError" class="error"></p>
    </div>
  </div>

  <div id="app" class="app" hidden>
    <nav class="rail">
      <button class="rail-btn home" id="homeBtn" title="Личные сообщения">🏠</button>
      <div class="rail-divider"></div>
      <div id="serverRail" class="server-rail"></div>
      <button class="rail-btn add" id="addServerBtn" title="Создать/присоединиться">+</button>
      <button class="rail-btn profile" id="profileBtn" title="Мой профиль">👤</button>
      <button class="rail-btn logout" id="logoutBtn" title="Выйти из аккаунта">⏻</button>
    </nav>

    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
    <aside class="members" id="membersPanel"></aside>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" id="modalBox"></div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="/app.js"></script>
</body>
</html>
